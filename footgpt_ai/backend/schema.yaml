          type: string
          format: date
      - in: query
        name: id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: last
        schema:
          type: integer
          maximum: 50
          minimum: 1
      - in: query
        name: league
        schema:
          type: integer
          minimum: 1
      - in: query
        name: live
        schema:
          type: string
          minLength: 1
