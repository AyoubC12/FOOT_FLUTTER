openapi: 3.0.3
info:
  title: FootGPT AI API
  version: 1.0.0
  description: Backend for FootGPT AI. Flutter must call these routes only. Football
    data is proxied from API-Football; the provider key never leaves the server. See
    backend/docs/football-api.md.
paths:
  /api/assistant/messages/:
    get:
      operationId: api_assistant_messages_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChatMessageList'
          description: ''
    post:
      operationId: api_assistant_messages_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
          description: ''
